[pytest]
# Pytest configuration file

# Minimum version
minversion = 7.0

# Test discovery patterns
python_files = test_*.py conftest.py
python_classes = Test*
python_functions = test_*

# BDD-related options
bdd_features_base_dir = features

addopts = 
    -v
    --strict-markers
    --tb=short

# Live console logging - shows each BDD step as it runs, no print()/logger calls needed in step files
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s - %(levelname)s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Markers for test categorization
markers =
    smoke: Mark test as part of smoke test suite
    Login: Mark test as login tests

